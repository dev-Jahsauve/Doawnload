services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - downloads:/app/server/downloads
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WORKER_CONCURRENCY: 2
    volumes:
      - downloads:/app/server/downloads
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_ORIGIN: http://server:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  redis-data:
  downloads:
